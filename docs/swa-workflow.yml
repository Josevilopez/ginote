# S6-03 — Workflow de Azure Static Web Apps adaptado al monorepo.
#
# Azure genera `.github/workflows/azure-static-web-apps-<nombre>.yml` al crear
# la Static Web App. Sustituye su contenido por este fichero y cambia SOLO
# el nombre del secreto (las dos líneas `AZURE_STATIC_WEB_APPS_API_TOKEN_...`)
# por el que aparezca en el fichero generado.
#
# Qué cambia respecto al generado:
#  - Solo salta si cambia la web o los paquetes que usa.
#  - Compila nosotros (npm ci + paquetes + web con VITE_API_ORIGIN) y la
#    acción solo sube `apps/web/dist` (skip_app_build).
name: Web (Static Web Apps)

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/azure-static-web-apps-*.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Compilar y desplegar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar
        run: npm ci

      - name: Compilar paquetes y web
        env:
          VITE_API_ORIGIN: https://api.guinoteonline.es
        run: |
          npm run build -w @guinote/engine
          npm run build -w @guinote/protocol
          npm run build -w @guinote/web

      - name: Desplegar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CAMBIAME }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Cerrar entorno de la PR
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CAMBIAME }}
          action: close
